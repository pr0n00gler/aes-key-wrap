name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test / Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.87.0"
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --all-targets --locked

  quality:
    name: Formatting, linting, and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --all --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --bin api --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  aes-backends:
    name: AES backend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: automatic
            rustflags: ""
          - name: software
            rustflags: --cfg aes_backend="soft"
          - name: compact-software
            rustflags: --cfg aes_backend="soft" --cfg aes_backend_soft="compact"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --locked
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

  cross-test:
    name: Cross-test / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cross --locked --version 0.2.5
      - run: cross test --all-targets --locked --target ${{ matrix.target }}

  fuzz-smoke:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo fuzz run api -- -runs=1000
